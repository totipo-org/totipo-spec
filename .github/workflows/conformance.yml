name: Totipo v1 conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    name: Authoritative Linux qualification (Nix)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Qualify specification and conformance
        run: nix flake check --print-build-logs path:.

  portability:
    name: Supplemental portability (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04
            go: '1.23.x'
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: conformance/go.sum
      - name: Spec structure
        run: |
          python3 tools/check_spec.py
          python3 tools/check_vectors.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l conformance)"
      - name: Vet and tests
        working-directory: conformance
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Manifest-driven conformance
        run: go run ./conformance/cmd/totipo-conformance -root .
      - name: Manifest and profile integrity
        run: go run ./conformance/cmd/totipo-conformance -root . -verify-only
